name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安裝依賴
        run: python -m pip install openpyxl pdfplumber
      - name: 執行測試
        run: python -m unittest discover -s tests -v
